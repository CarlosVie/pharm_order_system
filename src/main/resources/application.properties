spring.application.name=pharmacy-ordering

# --- RabbitMQ ---------------------------------------------------------------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Consumers: 3 attempts with exponential backoff, then reject WITHOUT requeue,
# which dead-letters the message (see Topology / RabbitConfig).
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=500ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# --- Database (H2 file, survives restarts) -----------------------------------
spring.datasource.url=jdbc:h2:file:${PHARMACY_DB_PATH:./data/pharmacy}
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# --- Misc ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
server.shutdown=graceful
